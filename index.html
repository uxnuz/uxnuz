<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>피드백</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>피드백</h1>
    <div class="topbar-actions">
      <label class="btn btn-primary">
        지도 불러오기
        <input type="file" id="mapInput" accept="image/*" hidden>
      </label>

      <label class="switch-control" title="아이콘 위에서 마우스 휠로 크기 조절 (선 제외)">
        <input type="checkbox" id="resizeToggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span class="switch-text">휠로 크기조절</span>
      </label>

      <div class="opacity-control">
        <span class="opacity-label">투명도</span>
        <input type="range" id="opacitySlider" min="0" max="100" value="100">
        <span id="opacityValue">100%</span>
      </div>

      <button id="exportBtn" class="btn" disabled>PNG로 내보내기</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <h2>표시 도구</h2>
      <div class="tool-list" id="toolList">
        <button class="tool-btn" data-tool="smoke" title="연막탄 (드래그로 투척)">
          <canvas class="tool-icon" width="32" height="32" data-icon="smoke"></canvas>
          <span>연막탄</span>
        </button>
        <button class="tool-btn" data-tool="grenade" title="수류탄 (드래그로 투척)">
          <canvas class="tool-icon" width="32" height="32" data-icon="grenade"></canvas>
          <span>투척 지점</span>
        </button>
        <div class="tool-group">
          <div class="tool-group-title">이동 동선</div>
          <div class="tool-group-selects">
            <select id="pathColorSelect" class="style-select" title="색상">
              <option value="blue" selected>파랑</option>
              <option value="red">빨강</option>
              <option value="yellow">노랑</option>
              <option value="green">초록</option>
            </select>
            <select id="pathStyleSelect" class="style-select" title="선 종류">
              <option value="dashed" selected>점선</option>
              <option value="solid">실선</option>
            </select>
          </div>
          <div class="tool-subrow">
            <button class="tool-btn tool-btn-small" data-tool="path-straight" title="직선 이동 동선">
              <canvas class="tool-icon" width="28" height="28" data-icon="path-straight"></canvas>
              <span>직선</span>
            </button>
            <button class="tool-btn tool-btn-small" data-tool="path-free" title="자유 곡선 이동 동선">
              <canvas class="tool-icon" width="28" height="28" data-icon="path-free"></canvas>
              <span>자유선</span>
            </button>
          </div>
        </div>
        <button class="tool-btn" data-tool="fireline" title="사격선 (사격 방향 표시)">
          <canvas class="tool-icon" width="32" height="32" data-icon="fireline"></canvas>
          <span>사격선</span>
        </button>
        <button class="tool-btn" data-tool="enemy" title="적 위치">
          <canvas class="tool-icon" width="32" height="32" data-icon="enemy"></canvas>
          <span>적 위치</span>
        </button>
        <div class="tool-group">
          <div class="tool-group-title">팀원 위치</div>
          <div class="tool-subrow tool-subrow-4">
            <button class="tool-btn tool-btn-small" data-tool="team1" title="팀원 1 (노랑)">
              <canvas class="tool-icon" width="26" height="26" data-icon="team1"></canvas>
            </button>
            <button class="tool-btn tool-btn-small" data-tool="team2" title="팀원 2 (빨강)">
              <canvas class="tool-icon" width="26" height="26" data-icon="team2"></canvas>
            </button>
            <button class="tool-btn tool-btn-small" data-tool="team3" title="팀원 3 (파랑)">
              <canvas class="tool-icon" width="26" height="26" data-icon="team3"></canvas>
            </button>
            <button class="tool-btn tool-btn-small" data-tool="team4" title="팀원 4 (초록)">
              <canvas class="tool-icon" width="26" height="26" data-icon="team4"></canvas>
            </button>
          </div>
        </div>
        <button class="tool-btn" data-tool="vehicle" title="차량 (드래그로 방향 지정)">
          <canvas class="tool-icon" width="32" height="32" data-icon="vehicle"></canvas>
          <span>차량</span>
        </button>
        <div class="tool-group">
          <div class="tool-group-title">엄폐물</div>
          <div class="tool-subrow tool-subrow-3">
            <button class="tool-btn tool-btn-small" data-tool="flare" title="긴급 엄폐 신호탄 (긴엄신)">
              <canvas class="tool-icon" width="26" height="26" data-icon="flare"></canvas>
              <span>긴엄신</span>
            </button>
            <button class="tool-btn tool-btn-small" data-tool="rock" title="바위">
              <canvas class="tool-icon" width="26" height="26" data-icon="rock"></canvas>
              <span>바위</span>
            </button>
            <button class="tool-btn tool-btn-small" data-tool="tree" title="나무">
              <canvas class="tool-icon" width="26" height="26" data-icon="tree"></canvas>
              <span>나무</span>
            </button>
          </div>
        </div>
      </div>

      <h2>편집</h2>
      <div class="tool-list">
        <button class="tool-btn" data-tool="select" title="선택 / 삭제">
          <canvas class="tool-icon" width="32" height="32" data-icon="select"></canvas>
          <span>선택/삭제</span>
        </button>
      </div>
      <div class="edit-actions">
        <button id="undoBtn" class="btn">실행취소</button>
        <button id="clearBtn" class="btn btn-danger">전체 지우기</button>
      </div>

      <div class="hint" id="hint">지도를 먼저 불러와 주세요.</div>
      <div class="hint-small">Ctrl+V 이미지 붙여넣기 · Ctrl+Z 실행취소<br>스크롤 확대/축소 · 우클릭 드래그 이동</div>
    </aside>

    <main class="canvas-area">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="mapCanvas"></canvas>
        <div class="empty-state" id="emptyState">
          <p>상단의 <b>지도 불러오기</b> 버튼으로 이미지를 업로드하거나,<br><b>Ctrl+V</b>로 클립보드에 복사한 이미지를 붙여넣으세요.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="script.js?v=4"></script>
</body>
</html>
