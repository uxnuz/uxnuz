<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG 전략 피드백 맵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>PUBG 전략 피드백 맵</h1>
    <div class="topbar-actions">
      <label class="btn btn-primary">
        지도 불러오기
        <input type="file" id="mapInput" accept="image/*" hidden>
      </label>
      <button id="exportBtn" class="btn" disabled>PNG로 내보내기</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <h2>표시 도구</h2>
      <div class="tool-list" id="toolList">
        <button class="tool-btn" data-tool="smoke" title="연막탄">
          <canvas class="tool-icon" width="32" height="32" data-icon="smoke"></canvas>
          <span>연막탄</span>
        </button>
        <button class="tool-btn" data-tool="grenade" title="수류탄 투척 지점">
          <canvas class="tool-icon" width="32" height="32" data-icon="grenade"></canvas>
          <span>투척 지점</span>
        </button>
        <div class="tool-group">
          <div class="tool-group-header">
            <span>이동 동선</span>
            <select id="pathStyleSelect" class="style-select">
              <option value="dashed" selected>점선</option>
              <option value="solid">실선</option>
            </select>
          </div>
          <div class="tool-subrow">
            <button class="tool-btn tool-btn-small" data-tool="path-straight" title="직선 이동 동선">
              <canvas class="tool-icon" width="28" height="28" data-icon="path-straight"></canvas>
              <span>직선</span>
            </button>
            <button class="tool-btn tool-btn-small" data-tool="path-free" title="자유 곡선 이동 동선">
              <canvas class="tool-icon" width="28" height="28" data-icon="path-free"></canvas>
              <span>자유선</span>
            </button>
          </div>
        </div>
        <button class="tool-btn" data-tool="enemy" title="적 위치">
          <canvas class="tool-icon" width="32" height="32" data-icon="enemy"></canvas>
          <span>적 위치</span>
        </button>
        <button class="tool-btn" data-tool="cover" title="엄폐물">
          <canvas class="tool-icon" width="32" height="32" data-icon="cover"></canvas>
          <span>엄폐물</span>
        </button>
      </div>

      <h2>편집</h2>
      <div class="tool-list">
        <button class="tool-btn" data-tool="select" title="선택 / 삭제">
          <canvas class="tool-icon" width="32" height="32" data-icon="select"></canvas>
          <span>선택/삭제</span>
        </button>
      </div>
      <div class="edit-actions">
        <button id="undoBtn" class="btn">실행취소</button>
        <button id="clearBtn" class="btn btn-danger">전체 지우기</button>
      </div>

      <div class="hint" id="hint">지도를 먼저 불러와 주세요. (Ctrl+V로 클립보드 이미지 붙여넣기 가능)</div>
    </aside>

    <main class="canvas-area">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="mapCanvas"></canvas>
        <div class="empty-state" id="emptyState">
          <p>상단의 <b>지도 불러오기</b> 버튼으로 이미지를 업로드하거나,<br><b>Ctrl+V</b>로 클립보드에 복사한 이미지를 붙여넣으세요.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
