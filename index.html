<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG 전략 피드백 맵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>PUBG 전략 피드백 맵</h1>
    <div class="topbar-actions">
      <label class="btn btn-primary">
        지도 불러오기
        <input type="file" id="mapInput" accept="image/*" hidden>
      </label>
      <button id="exportBtn" class="btn" disabled>PNG로 내보내기</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <h2>표시 도구</h2>
      <div class="tool-list" id="toolList">
        <button class="tool-btn" data-tool="smoke" title="연막탄">
          <canvas class="tool-icon" width="32" height="32" data-icon="smoke"></canvas>
          <span>연막탄</span>
        </button>
        <button class="tool-btn" data-tool="grenade" title="수류탄 투척 지점">
          <canvas class="tool-icon" width="32" height="32" data-icon="grenade"></canvas>
          <span>투척 지점</span>
        </button>
        <button class="tool-btn" data-tool="path" title="이동 동선">
          <canvas class="tool-icon" width="32" height="32" data-icon="path"></canvas>
          <span>이동 동선</span>
        </button>
        <button class="tool-btn" data-tool="enemy" title="적 위치">
          <canvas class="tool-icon" width="32" height="32" data-icon="enemy"></canvas>
          <span>적 위치</span>
        </button>
        <button class="tool-btn" data-tool="cover" title="엄폐물">
          <canvas class="tool-icon" width="32" height="32" data-icon="cover"></canvas>
          <span>엄폐물</span>
        </button>
      </div>

      <h2>편집</h2>
      <div class="tool-list">
        <button class="tool-btn" data-tool="select" title="선택 / 삭제">
          <canvas class="tool-icon" width="32" height="32" data-icon="select"></canvas>
          <span>선택/삭제</span>
        </button>
      </div>
      <div class="edit-actions">
        <button id="undoBtn" class="btn">실행취소</button>
        <button id="clearBtn" class="btn btn-danger">전체 지우기</button>
      </div>

      <div class="hint" id="hint">지도를 먼저 불러와 주세요.</div>
    </aside>

    <main class="canvas-area">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="mapCanvas"></canvas>
        <div class="empty-state" id="emptyState">
          <p>상단의 <b>지도 불러오기</b> 버튼으로<br>맵 캡처 이미지를 업로드하세요.</p>
        </div>
      </div>
    </main>
  </div>

  <div class="path-toolbar" id="pathToolbar" hidden>
    <span>경로 점을 클릭해서 추가하세요 (더블클릭/Enter로 완료, Esc로 취소)</span>
    <button id="pathFinishBtn" class="btn btn-primary">경로 완료</button>
    <button id="pathCancelBtn" class="btn">취소</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
